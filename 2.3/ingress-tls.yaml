apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  #annotations:
  #  kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - myapp.example.com
    secretName: myapp-tls-secret
  rules:
  - hosts:
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myapp-service 
            port: 
              number: 80
