apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-web-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>K8s Task Success</title>
        <style>
            body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
            h1 { color: #326ce5; }
        </style>
    </head>
    <body>
        <h1>Hello from ConfigMap!</h1>
        <p>This page is served by Nginx inside Kubernetes.</p>
    </body>
    </html>
