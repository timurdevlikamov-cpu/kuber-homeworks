apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container-app
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          command: ["/bin/sh", "-c"]
          args: ["while true; do sleep 30; done"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: multi-container-service
spec:
  selector:
    app: my-app
  ports:
    - name: nginx-access
      protocol: TCP
      port: 9001
      targetPort: 80
    - name: multitool-access
      protocol: TCP
      port: 9002
      targetPort: 8080

